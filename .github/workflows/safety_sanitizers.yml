name: Safety & Sanitizers CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-multilib libasan8 libubsan1 libtsan2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e "./contrib[all]"

      - name: Compile C Hot Path with Sanitizers
        run: |
          mkdir -p build
          if [ "${{ matrix.sanitizer }}" = "address" ]; then
            gcc -fsanitize=address -O1 -g -fno-omit-frame-pointer -shared -fPIC -o src/libfastpath.so src/fastpath.c -lm
            cp src/libfastpath.so src/_fastpath_native.so
            gcc -fsanitize=address -O1 -g -fno-omit-frame-pointer -o build/mdrap-core src/mdrap_core.c -lm
          elif [ "${{ matrix.sanitizer }}" = "undefined" ]; then
            gcc -fsanitize=undefined -O1 -g -shared -fPIC -o src/libfastpath.so src/fastpath.c -lm
            cp src/libfastpath.so src/_fastpath_native.so
            gcc -fsanitize=undefined -O1 -g -o build/mdrap-core src/mdrap_core.c -lm
          elif [ "${{ matrix.sanitizer }}" = "thread" ]; then
            gcc -fsanitize=thread -O1 -g -shared -fPIC -o src/libfastpath.so src/fastpath.c -lm
            cp src/libfastpath.so src/_fastpath_native.so
            gcc -fsanitize=thread -O1 -g -o build/mdrap-core src/mdrap_core.c -lm
          fi

      - name: Run Native Core Under Sanitizer
        run: |
          build/mdrap-core --events 100000 --quiet

      - name: Run Test Suite Under Sanitizer
        run: |
          if [ "${{ matrix.sanitizer }}" = "address" ]; then
            LIB_ASAN=$(gcc -print-file-name=libasan.so)
            if [ ! -f "$LIB_ASAN" ]; then
              LIB_ASAN=$(find /usr/lib/ -name "libasan.so*" 2>/dev/null | head -n 1)
            fi
            export LD_PRELOAD="$LIB_ASAN"
            export ASAN_OPTIONS="detect_leaks=0:verify_asan_link_order=0"
          elif [ "${{ matrix.sanitizer }}" = "thread" ]; then
            LIB_TSAN=$(gcc -print-file-name=libtsan.so)
            if [ ! -f "$LIB_TSAN" ]; then
              LIB_TSAN=$(find /usr/lib/ -name "libtsan.so*" 2>/dev/null | head -n 1)
            fi
            export LD_PRELOAD="$LIB_TSAN"
            export TSAN_OPTIONS="suppress_equal_stacks=1"
          fi
          pytest tests/test_fastpath.py tests/test_shm.py -v -q --timeout=60
