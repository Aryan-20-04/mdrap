name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pyarrow || true

      - name: Compile C Native Accelerator
        run: python build_fastpath.py

      - name: Verify Rules Single Source of Truth
        run: python tools/gen_reasons.py --check

      - name: Run Test Suite
        run: pytest tests/ -v -q --timeout=60

      - name: Verify Environment Diagnostics
        run: python cli.py doctor

      - name: Micro-Benchmark Smoke Check
        run: python benchmarks/micro_ffi.py --iterations 100000 --runs 2
