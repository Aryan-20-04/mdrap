name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "./contrib[all]"

      - name: Compile C Native Accelerator
        run: python build_fastpath.py

      - name: Code Formatting Check
        run: ruff format --check src/

      - name: Static Analysis & Linting
        run: ruff check src/

      - name: Verify Rules Single Source of Truth
        run: python tools/gen_reasons.py --check

      - name: Verify Verifiable Documentation Claims
        run: python scripts/gen_claims.py --check

      - name: Run Test Suite
        run: pytest tests/ -q --timeout=120 --tb=short

      - name: Run Test Suite (Pure Python Fallback Parity)
        env:
          MDRAP_DISABLE_FASTPATH: "1"
        run: pytest tests/test_phase5_event_type_parity.py -q --tb=short

      - name: Execute Full 9-Stage Quality Protocol
        run: python scripts/check.py



      - name: Verify Environment Diagnostics
        run: mdrap doctor --json

      - name: Verify Documentation Suite
        run: |
          pytest tests/test_docs_verification.py -q
          python tools/check_docs.py

      - name: Build and Inspect Core and Contrib Artifacts
        run: python scripts/verify_release_artifacts.py

      - name: Micro-Benchmark Smoke Check
        run: python benchmarks/micro_ffi.py --iterations 100000 --runs 2
