name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "./contrib[all]"

      - name: Compile C Native Accelerator
        run: python build_fastpath.py

      - name: Verify Rules Single Source of Truth
        run: python tools/gen_reasons.py --check

      - name: Run Test Suite
        run: pytest tests/ -q --timeout=120 --tb=short



      - name: Verify Environment Diagnostics
        run: mdrap doctor --json

      - name: Verify Documentation Suite
        run: pytest tests/test_docs_verification.py -q

      - name: Build and Inspect Core and Contrib Artifacts
        run: python scripts/verify_release_artifacts.py

      - name: Micro-Benchmark Smoke Check
        run: python benchmarks/micro_ffi.py --iterations 100000 --runs 2
