name: Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_TEST_COMMAND: "python -c \"import mdrap; from mdrap.engine import Engine; from mdrap.ingestlog import IngestLog; print('Wheel test passed')\""

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  smoke_tests:
    needs: [build_wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: dist

      - name: Install and smoke test wheel in clean environment
        shell: bash
        run: |
          python -m venv .venv-test
          source .venv-test/bin/activate || source .venv-test/Scripts/activate
          pip install dist/*.whl
          python -c "import mdrap; from mdrap.engine import Engine; from mdrap.ingestlog import IngestLog; from mdrap.projection import SQLiteProjection; print('Smoke test verified on', '${{ matrix.os }}')"
          mdrap --help

  publish:
    needs: [build_wheels, smoke_tests]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
