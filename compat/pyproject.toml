[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdrap-compat"
version = "6.0.0"
description = "Opt-in legacy top-level import shims for MDRAP 3.0"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mdrap-core>=3.1.2", "mdrap-contrib>=3.1.2"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "_version", "alert_sinks", "alerts", "analytics", "api", "archive", "async_fanout",
  "audit_format", "backtest", "bardb", "bbo", "benchmark", "chaos",
  "chd", "chd_history", "cli", "client", "clock", "columnar", "config",
  "config_loader", "consensus", "dashboard", "databento_feed",
  "depth", "engine", "export", "exporter", "failover", "fastpath", "features",
  "feed_handler", "fix_engine", "flow_tracker", "fx", "gateway",
  "gateway_tcp", "historical", "historical_verifier", "ingestlog", "ingress", "itch", "journal", "kafka_sink", "live",
  "manifest", "mbo", "metrics", "models", "multicast_arbitrator",
  "navigator", "options", "partition", "pcap", "pipeline", "plugins",
  "polygon_feed", "projection", "prometheus", "protocol", "protocols",
  "quality", "quarantine", "reconciliation", "recovery", "replay",
  "risk", "rules", "runtime", "sbe", "scheduler", "security", "service",
  "shm", "shm_drainer", "simulator", "storage", "strategy_sdk", "stresstest", "supervisor",
  "symbology", "tca", "term", "terminal_display", "trading_cli", "venues",
  "vessel", "watchdog", "workload_simulator", "ws_feed",
]
