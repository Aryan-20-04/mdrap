[pytest]
pythonpath = src .
testpaths = tests
asyncio_default_fixture_loop_scope = function
addopts = -m "not slow and not network"
markers =
    slow: marks tests as slow (stress/throughput/soak — deselected by default, run with pytest -m slow)
    network: marks tests that require external network access (deselected by default, run with pytest -m network)
filterwarnings =
    ignore:.*PytestDeprecationWarning.*:DeprecationWarning
    ignore:.*pytest_asyncio.*:DeprecationWarning
