[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdrap"
version = "1.0.0"
description = "Market Data Reliability & Acceleration Platform - Financial market infrastructure for converting noisy market feeds into validated canonical streams"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MDRAP Team" }
]
keywords = [
    "market-data",
    "hft",
    "trading",
    "bbo",
    "nbbo",
    "cryptocurrency",
    "finance",
    "latency",
    "data-quality",
    "infrastructure"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Operating System :: OS Independent",
]
dependencies = [
    # MDRAP is 100% runnable on pure Python standard library.
    # Optional styling library:
    "rich>=13.0.0",
]

[project.optional-dependencies]
export = [
    "openpyxl>=3.1.0",
]
stream = [
    "websockets>=12.0",
]
config = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
]
all = [
    "rich>=13.0.0",
    "openpyxl>=3.1.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
mdrap = "cli:main"

[tool.setuptools]
py-modules = [
    "cli", "analytics", "archive", "async_storage", "bbo", "benchmark", "broker", 
    "chaos", "client", "columnar", "config", "dashboard", "databento_feed", "depth", 
    "excel_bridge", "exporter", "fastpath", "feed_handler", "feed_workers", 
    "flow_tracker", "gateway", "gateway_tcp", "live", "mbo", "metrics", "models", 
    "multicast_arbitrator", "pipeline", "pipeline_v2", "polygon_feed", "prometheus", 
    "protocol", "quality", "reconciliation", "sbe", "sdk_dashboard", "security", 
    "service", "sharded_pipeline", "shm", "simulator", "spsc_ring", "storage", 
    "strategy_sdk", "stresstest", "tca", "term", "terminal_display", "watchdog", 
    "web_cockpit", "workload_simulator", "ws_feed"
]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
