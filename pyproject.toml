[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdrap-core"
dynamic = ["version"]
description = "Market Data Reliability & Acceleration Platform - Financial market infrastructure for converting noisy market feeds into validated canonical streams"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "MDRAP Team" }
]
keywords = [
    "market-data",
    "hft",
    "trading",
    "bbo",
    "nbbo",
    "cryptocurrency",
    "finance",
    "latency",
    "data-quality",
    "infrastructure"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Operating System :: OS Independent",
]
dependencies = [
    # MDRAP core platform has zero mandatory external dependencies (pure Python stdlib).
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "pytest>=8.4.2",
    "pytest-timeout>=2.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

# MDRAP Extension Entry Points
# Third-party packages can register extensions by declaring entries in these groups:
#   - mdrap.adapters: Feed adapters implementing the FeedAdapter protocol
#   - mdrap.quality_rules: Initializers that register custom quality rules
#   - mdrap.storage_backends: Storage engines implementing the StorageBackend protocol
#   - mdrap.auth_providers: Auth/entitlement providers implementing AuthProvider
#   - mdrap.output_sinks: Event delivery sinks implementing OutputSink
#   - mdrap.alert_sinks: Alert delivery sinks implementing AlertSink

[project.entry-points."mdrap.adapters"]
template = "mdrap.adapters.template:TemplateAdapter"

[tool.setuptools]
py-modules = []
package-dir = {"" = "src"}

[tool.setuptools.cmdclass]
build_py = "mdrap_build.CleanBuildPy"

[tool.setuptools.dynamic]
version = {attr = "mdrap._version.__version__"}

[tool.setuptools.package-data]
"mdrap" = [
    "fastpath.c",
    "_fastpath_c.c",
    "mdrap_core.c",
    "rules.def",
    "py.typed",
    "*.pyi",
    "*.pyd",
    "_fastpath_native.dll",
    "_fastpath_native.so",
    "_fastpath_native.dylib",
    "_fastpath_native.pyd",
    "fastpath.dll",
    "fastpath.dylib",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mdrap", "mdrap.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line length handled by formatter
    "W291",  # Trailing whitespace in multiline SQL statements
    "F403",  # Star imports in modular CLI and package shims
    "F405",  # Undefined from star imports
    "F401",  # Unused imports in package shims and interfaces
]


[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[tool.cibuildwheel]
build-verbosity = 1
archs = ["auto64"]
skip = ["pp*", "*i686", "*musllinux*"]
