[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdrap-contrib-vessel"
version = "1.0.0"
description = "MDRAP Contrib Maritime Telemetry & Vessel Tracking for Commodity Supply Line Analytics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MDRAP Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mdrap-core>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mdrap_vessel*"]
