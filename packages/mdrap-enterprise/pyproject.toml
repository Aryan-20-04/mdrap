[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdrap-enterprise"
version = "1.0.0"
description = "MDRAP Enterprise Extensions: Multi-Tenant RBAC, Key Rotation, and TLS Reverse Proxy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MDRAP Institutional Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mdrap-core>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mdrap_enterprise*"]
