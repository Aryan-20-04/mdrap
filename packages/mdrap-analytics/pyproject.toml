[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdrap-analytics"
version = "1.0.0"
description = "MDRAP Transaction Cost Analysis (TCA), Slippage Estimation, and Broker Scorecards"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MDRAP Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mdrap-core>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mdrap_analytics*"]
